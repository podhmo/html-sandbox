<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img" aria-label="One bundle directory becomes one page">
  <style>
    .box { fill: #eef6ff; stroke: #3584e4; stroke-width: 1.5; rx: 6; }
    .txt { font: 13px/1.3 sans-serif; fill: #1d5fb8; text-anchor: middle; }
    .arrow { stroke: #99c1f1; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#99c1f1"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="12" width="120" height="136"/>
  <text class="txt" x="68" y="30">bundle.md/</text>
  <rect class="box" x="20" y="42" width="96" height="22"/>
  <text class="txt" x="68" y="57">README.md</text>
  <rect class="box" x="20" y="70" width="96" height="22"/>
  <text class="txt" x="68" y="85">notes.md</text>
  <rect class="box" x="20" y="98" width="96" height="22"/>
  <text class="txt" x="68" y="113">hello.go</text>
  <path class="arrow" d="M136,80 h48"/>
  <rect class="box" x="192" y="48" width="120" height="64"/>
  <text class="txt" x="252" y="74">one page</text>
  <text class="txt" x="252" y="94">with sections</text>
</svg>
